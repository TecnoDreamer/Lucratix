name: backend-ci

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "tests/**"
      - "pytest.ini"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketing_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/marketing_platform_test
      JWT_SECRET_KEY: ci-only-secret-never-used-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: apps/api
        run: ruff check .

      - name: Type check (mypy)
        working-directory: apps/api
        run: mypy app

      - name: Tests (unit, integration, api, security)
        run: pytest --cov=app --cov-report=term-missing
