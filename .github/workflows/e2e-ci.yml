name: e2e-ci

# Pipeline preparado para quando os fluxos E2E (Playwright) forem implementados
# (ver docs/product/roadmap.md — a partir da Fase 6/7 em diante, quando houver
# UI suficiente para login + selecao de empresa). Ate la, roda como no-op para
# nao quebrar o CI, sem inventar sucesso de testes que ainda nao existem.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica se ha testes E2E para executar
        run: |
          if [ -z "$(find tests/e2e -name '*.spec.ts' 2>/dev/null)" ]; then
            echo "Nenhum teste E2E ainda (esperado nesta fase do projeto). Ver docs/product/roadmap.md."
            exit 0
          fi
          echo "Testes E2E encontrados — implementar execucao via Playwright aqui."
          exit 1
