name: e2e-ci

# Sobe Postgres + API (com migrations aplicadas) + front-end (build de
# producao) e roda os testes Playwright (tests/e2e) contra o stack real,
# de ponta a ponta — nao mocka nada (secao 15 do prompt mestre).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketing_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/marketing_platform
      JWT_SECRET_KEY: e2e-only-secret-never-used-in-production
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Apply migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Start API server (background)
        working-directory: apps/api
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build frontend (producao)
        working-directory: apps/web
        run: npm run build

      - name: Start frontend server (background)
        working-directory: apps/web
        run: nohup npm start -- -p 3000 > web.log 2>&1 &

      - name: Aguardar API e front-end ficarem prontos
        # http-get:// (nao http://): wait-on usa HEAD por padrao, mas
        # GET /health so aceita GET (405 em HEAD), o que travava a espera
        # ate o timeout mesmo com os dois servidores no ar.
        run: npx --yes wait-on http-get://localhost:8000/health http://localhost:3000 --timeout 60000

      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E
        run: npx playwright test

      - name: Upload logs de API/front-end (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            apps/api/api.log
            apps/web/web.log

      - name: Upload relatorio do Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
