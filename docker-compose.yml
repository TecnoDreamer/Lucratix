services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-marketing_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/marketing_platform}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-troque-esta-chave-antes-de-qualquer-uso-real}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:3000"]}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # E-mail transacional (RF-001, ver app/core/email.py e
      # docs/security/AUTHENTICATION.md). RESEND_API_KEY sem valor no .env
      # da raiz mantem o comportamento de hoje (dev_token, nenhuma chamada
      # de rede) — so precisa existir aqui pra docker compose repassar pro
      # container quando o usuario preencher o .env.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Lucratix <onboarding@resend.dev>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      # Logotipo de empresa (ver app/core/storage.py). Vazio no .env da raiz
      # mantem o comportamento de hoje (upload desabilitado, 503) — so
      # precisa existir aqui pra docker compose repassar pro container
      # quando o usuario preencher o .env (mesmo padrao do RESEND_API_KEY).
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    tmpfs:
      - /app/.next
    depends_on:
      - api

volumes:
  db_data:
