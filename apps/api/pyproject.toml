[project]
name = "api"
version = "0.1.0"
description = "Lucratix — Business Intelligence e Analytics — API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    # Importacao/exportacao de .xlsx (modulo de dados, 2026-08-29) — puro
    # Python, sem dependencia nativa, ja escolhido no lugar de pandas
    # (que traria numpy e um footprint bem maior so pra ler/escrever
    # planilha). Cobre leitura E escrita, entao serve tanto o import
    # quanto o export.
    "openpyxl>=3.1",
    # Relatorio em PDF server-side (Funil, 2026-09-02) — decisao confirmada
    # com o usuario (server-side, Python). ReportLab e pip-instalavel sem
    # nenhuma biblioteca de sistema (ao contrario de WeasyPrint, que exige
    # Pango/Cairo/GDK-PixBuf na imagem Docker) — mesmo criterio ja usado
    # para escolher openpyxl no lugar de pandas acima.
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "httpx2>=2.12",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
    "pip-audit>=2.7",
    # So para os testes lerem/conferirem o texto de dentro do PDF gerado
    # (app/modules/reports/pdf_builder.py) — nunca usado em producao.
    "pypdf>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: assert e uso normal em teste. B008: Depends(...)/require_role(...) como
# default de parametro e o idioma padrao do FastAPI para injecao de dependencia,
# nao um bug real (ver https://fastapi.tiangolo.com/tutorial/dependencies/).
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# Segredo de exemplo/seed, nunca um valor real (ver docs/security/, secao 32 do prompt mestre).
"app/core/config.py" = ["S105"]
"app/seed.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
